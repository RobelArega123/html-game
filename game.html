<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Emoji Game</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f1ec;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #gameBox {
      height: 350px;
      position: relative;
      background-color: white;
      border-radius: 20px;
      border: 2px solid #ddd;
      overflow: hidden;
    }

    #target {
      font-size: 45px;
      position: absolute;
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="container mt-5">
    <h1 class="mb-3">Click the Emoji Game</h1>
    <p class="lead">Click the moving emoji before time runs out.</p>

    <div class="row mb-3">
      <div class="col">
        <h4>Score: <span id="score">0</span></h4>
      </div>
      <div class="col">
        <h4>Time: <span id="time">20</span></h4>
      </div>
    </div>

    <button class="btn btn-primary mb-3" onclick="startGame()">Start Game</button>

    <div id="gameBox" class="shadow">
      <div id="target">🍕</div>
    </div>

    <p id="message" class="mt-3 fw-bold"></p>
  </div>

  <script>
    const gameData = {
      "emojis": ["🍕", "🍔", "⚽", "🎯", "⭐", "🔥"],
      "startTime": 20,
      "pointsPerClick": 1
    };

    let score = 0;
    let timeLeft = gameData.startTime;
    let timer;
    let gameRunning = false;

    const target = document.getElementById("target");
    const scoreDisplay = document.getElementById("score");
    const timeDisplay = document.getElementById("time");
    const message = document.getElementById("message");
    const gameBox = document.getElementById("gameBox");

    function startGame() {
      score = 0;
      timeLeft = gameData.startTime;
      gameRunning = true;

      scoreDisplay.textContent = score;
      timeDisplay.textContent = timeLeft;
      message.textContent = "";

      moveTarget();

      clearInterval(timer);
      timer = setInterval(function() {
        timeLeft--;
        timeDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function moveTarget() {
      if (!gameRunning) return;

      let maxX = gameBox.clientWidth - 60;
      let maxY = gameBox.clientHeight - 60;

      let randomX = Math.floor(Math.random() * maxX);
      let randomY = Math.floor(Math.random() * maxY);

      let randomEmoji = gameData.emojis[Math.floor(Math.random() * gameData.emojis.length)];

      target.style.left = randomX + "px";
      target.style.top = randomY + "px";
      target.textContent = randomEmoji;
    }

    target.onclick = function() {
      if (gameRunning) {
        score += gameData.pointsPerClick;
        scoreDisplay.textContent = score;
        moveTarget();
      }
    };

    function endGame() {
      gameRunning = false;
      clearInterval(timer);
      message.textContent = "Game over! Your final score is " + score + ".";
    }
  </script>

</body>
</html>
